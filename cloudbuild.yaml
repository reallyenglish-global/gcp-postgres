steps:
- name: gcr.io/cloud-builders/docker
  entrypoint: bash
  args: [ci/build-verified.sh, '${_BASE_IMAGE_VERSION}', '${_BASE_TAG}', '${_DOCKER_REPO}', '$SHORT_SHA']

# Cloud Build uploads only after the runtime gate succeeds. Promotion of
# a version to the shared latest tag is a separate release decision.
images:
- '${_DOCKER_REPO}:$SHORT_SHA'
- '${_DOCKER_REPO}:${_BASE_TAG}'
