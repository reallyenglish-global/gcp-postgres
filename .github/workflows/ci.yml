name: Build PostgreSQL image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_image_version:
        description: 'Postgres base image version (for example: 18.1)'
        required: true
        type: string
      publish:
        description: 'Publish verified version to GHCR (main only)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOCKER_REPO: ghcr.io/reallyenglish-global/postgres

  BASE_IMAGE_VERSION: ${{ inputs.base_image_version || vars.BASE_IMAGE_VERSION }}

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || vars.BASE_IMAGE_VERSION != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify the selected version without publishing
        run: bash ci/build-verified.sh "$BASE_IMAGE_VERSION" "$BASE_IMAGE_VERSION" local/gcp-postgres "$GITHUB_SHA"
  publish_docker:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v2
      - uses: docker/setup-buildx-action@v2

      - name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: |
            BASE_IMAGE_VERSION=${{ env.BASE_IMAGE_VERSION }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKER_REPO }}:${{ env.BASE_IMAGE_VERSION }}
