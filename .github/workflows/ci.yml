name: CI

on:
  push:
  workflow_dispatch:
    inputs:
      base_image_version:
        description: 'Postgres base image version (for example: 18.1)'
        required: false
        default: '18.1'

permissions:
  contents: write
  packages: write

env:
  DOCKER_REPO: ghcr.io/reallyenglish-global/postgres

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run shell tests
        run: bash test/replica_ready_or_reseed_test.sh

      - name: Check shell syntax
        run: |
          bash -n \
            bin/replica_ready_or_reseed \
            test/replica_ready_or_reseed_test.sh \
            bin/archive_wal.sh \
            bin/recover \
            bin/takebackup \
            bin/takedump

      - name: Run shellcheck
        run: |
          shellcheck \
            bin/replica_ready_or_reseed \
            test/replica_ready_or_reseed_test.sh \
            bin/archive_wal.sh \
            bin/recover \
            bin/takebackup \
            bin/takedump

  publish_docker:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    env:
      BASE_IMAGE_VERSION: ${{ github.event.inputs.base_image_version || vars.BASE_IMAGE_VERSION || '18.1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v2
      - uses: docker/setup-buildx-action@v2

      - name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: |
            VERSION=${{ env.BASE_IMAGE_VERSION }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKER_REPO }}:${{ env.BASE_IMAGE_VERSION }}
