name: Validate production image (no publish)
on:
  pull_request:
    branches: [production]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Build and check the requested PostgreSQL binary (local runner image only)
      run: bash ci/build-verified.sh 18.7 18.7 local/gcp-postgres "$GITHUB_SHA"
